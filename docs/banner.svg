<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1536 500" width="1536" height="500">
  <defs>
    <filter id="ink" x="-20%" y="-20%" width="140%" height="140%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="13" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="120" xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <filter id="glow" x="-20%" y="-50%" width="140%" height="200%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <!-- Radial gradient for mandala-like glow -->
    <radialGradient id="aura" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7c3aed" stop-opacity="0.3"/>
      <stop offset="60%" stop-color="#1e1b4b" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <!-- Ink reveal mask -->
    <mask id="reveal">
      <rect width="1536" height="500" fill="black"/>
      <circle cx="768" cy="250" r="0" fill="white" filter="url(#ink)">
        <animate attributeName="r" values="0;0;1100"
                 keyTimes="0;0.0909;1"
                 dur="13s" fill="freeze"
                 calcMode="spline" keySplines="0 0 1 1; 0.22 0.61 0.36 1"/>
      </circle>
    </mask>
  </defs>

  <!-- Background -->
  <rect width="1536" height="500" fill="#0d1117"/>

  <!-- Content revealed with ink mask -->
  <g mask="url(#reveal)">

    <!-- Aura glow centered -->
    <ellipse cx="768" cy="250" rx="500" ry="300" fill="url(#aura)"/>

    <!-- Mandala rings (concentric, right side) -->
    <circle cx="1280" cy="250" r="200" fill="none" stroke="#7c3aed" stroke-width="0.8" opacity="0.3"/>
    <circle cx="1280" cy="250" r="160" fill="none" stroke="#a855f7" stroke-width="0.6" opacity="0.25"/>
    <circle cx="1280" cy="250" r="120" fill="none" stroke="#7c3aed" stroke-width="1" opacity="0.2"/>
    <circle cx="1280" cy="250" r="80" fill="none" stroke="#c084fc" stroke-width="0.8" opacity="0.3"/>
    <circle cx="1280" cy="250" r="40" fill="none" stroke="#e9d5ff" stroke-width="1.5" opacity="0.4"/>
    <circle cx="1280" cy="250" r="10" fill="#c084fc" opacity="0.6"/>
    <!-- Mandala cross lines -->
    <line x1="1280" y1="50" x2="1280" y2="450" stroke="#7c3aed" stroke-width="0.5" opacity="0.2"/>
    <line x1="1080" y1="250" x2="1480" y2="250" stroke="#7c3aed" stroke-width="0.5" opacity="0.2"/>
    <line x1="1138" y1="108" x2="1422" y2="392" stroke="#7c3aed" stroke-width="0.4" opacity="0.15"/>
    <line x1="1422" y1="108" x2="1138" y2="392" stroke="#7c3aed" stroke-width="0.4" opacity="0.15"/>

    <!-- Stars -->
    <circle cx="100" cy="50" r="1.5" fill="#e9d5ff" opacity="0.5"/>
    <circle cx="250" cy="35" r="1" fill="#ffffff" opacity="0.4"/>
    <circle cx="400" cy="70" r="2" fill="#c084fc" opacity="0.5"/>
    <circle cx="550" cy="25" r="1" fill="#ffffff" opacity="0.3"/>
    <circle cx="680" cy="45" r="1.5" fill="#00e5ff" opacity="0.35"/>
    <circle cx="830" cy="60" r="1" fill="#ffffff" opacity="0.4"/>
    <circle cx="180" cy="120" r="1" fill="#e9d5ff" opacity="0.3"/>
    <circle cx="320" cy="150" r="1.5" fill="#ffffff" opacity="0.25"/>

    <!-- Fibonacci spiral hint (SVG path, simplified) -->
    <path d="M 200 420 Q 200 320 300 320 Q 400 320 400 420 Q 400 520 200 520"
          fill="none" stroke="#7c3aed" stroke-width="0.8" opacity="0.2"/>

    <!-- Accent bar -->
    <rect x="60" y="55" width="140" height="2" fill="#c084fc" rx="1"/>

    <!-- MAIN TITLE -->
    <text x="60" y="230"
          font-family="'Courier New',Courier,monospace"
          font-size="160"
          font-weight="900"
          fill="#e9d5ff">APACHETA</text>

    <!-- Subtitle -->
    <text x="64" y="285"
          font-family="'Courier New',Courier,monospace"
          font-size="17"
          fill="#a855f7"
          letter-spacing="7">HUB DE CONOCIMIENTO PERSONAL  ·  MINDFULNESS TECH  ·  TU BIBLIA PROPIA</text>

    <!-- Brand stamp -->
    <rect x="60" y="390" width="240" height="52" fill="none" stroke="#c084fc" stroke-width="1.5" rx="2"/>
    <text x="72" y="410" font-family="'Courier New',monospace" font-size="11" fill="#c084fc">• APACHETA •</text>
    <text x="72" y="428" font-family="'Courier New',monospace" font-size="10" fill="#a855f7">[ORACLE/Y]  [NOTEBOOKLM/Y]</text>
    <text x="72" y="444" font-family="'Courier New',monospace" font-size="9" fill="#30363d">SOUTH HUSTLES  #002</text>

    <!-- Pulse dots -->
    <circle cx="64" cy="335" r="5" fill="#c084fc" filter="url(#glow)">
      <animate attributeName="opacity" values="1;0.2;1" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="80" cy="335" r="5" fill="#7c3aed" filter="url(#glow)">
      <animate attributeName="opacity" values="0.2;1;0.2" dur="2.2s" repeatCount="indefinite"/>
    </circle>
    <circle cx="96" cy="335" r="5" fill="#00e5ff" filter="url(#glow)">
      <animate attributeName="opacity" values="0.6;0.2;1" dur="3s" repeatCount="indefinite"/>
    </circle>

  </g>
</svg>
